<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">

      <div class="detail-header__group">

      </div>
      <div class="detail-header__group">
        <button class="button button--ghost" id="theme-toggle" type="button">Тема</button>
      </div>

    <section class="edit-panel">

      <div class="form-card">
        <p class="detail-subvalue" id="confirm-description">Проверяем токен подтверждения...</p>
        <div class="link-actions">
          <button class="button button--primary" id="retry-btn" type="button" hidden>Повторить</button>
          <a class="button button--ghost" href="user.html">Профиль</a>
        </div>
      </div>
    </section>
  </div>

  <script src="constants.js?v=4"></script>
  <script src="ui-utils.js?v=3"></script>
