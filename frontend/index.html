<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plants Bot - Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <section class="hero">
      <div>
        <p class="eyebrow">Plants bot</p>
        <h1>Plant dashboard</h1>
        <p class="lede">Track watering and fertilizing tasks, keep schedules in one place, and share notes about every plant.</p>
        <div class="hero__actions">
          <button class="button button--primary" id="refresh">Refresh data</button>
          <button class="button button--ghost" type="button">Export PDF</button>
        </div>
      </div>
      <div class="stats-grid" id="stats"></div>
    </section>

    <div class="filters">
      <div class="search">
        <input id="search" type="search" placeholder="Search by name or latin name" />
      </div>
      <button class="pill is-active" data-filter="all">All</button>
      <button class="pill" data-filter="due">Need attention</button>
      <button class="pill" data-filter="warm">Warm period</button>
      <button class="pill" data-filter="cold">Cold period</button>
    </div>

    <div class="section-title">Your plants</div>
    <div class="cards" id="cards"></div>

    <div class="section-title">Upcoming tasks</div>
    <div class="timeline" aria-live="polite">
      <ul class="timeline__list" id="timeline"></ul>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
