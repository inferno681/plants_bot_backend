<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plants Bot - Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <section class="hero">
      <div>
        <p class="eyebrow">Бот растений</p>
        <h1>Дашборд растений</h1>
        <p class="lede">Следите за поливом и подкормкой, держите расписание под рукой и сохраняйте заметки по каждому растению.</p>
        <div class="hero__actions">
          <button class="button button--primary" id="refresh">Обновить данные</button>
          <button class="button button--ghost" type="button">Экспорт</button>
          <button class="button button--ghost" type="button" id="theme-toggle">Тема</button>
        </div>
      </div>
      <div class="stats-grid" id="stats"></div>
    </section>

    <div class="filters">
      <div class="search">
        <input id="search" type="search" placeholder="Поиск по имени или латинскому названию" />
      </div>
      <button class="pill is-active" data-filter="all">Все</button>
      <button class="pill" data-filter="due">Требуют внимания</button>
      <button class="pill" data-filter="warm">Тёплый период</button>
      <button class="pill" data-filter="cold">Холодный период</button>
    </div>

    <div class="section-title">Ваши растения</div>
    <div class="cards-panel">
      <div class="cards" id="cards" aria-live="polite"></div>
      <button class="load-more" id="load-more" type="button" hidden>Загрузить ещё</button>
    </div>

    <div class="section-title" id="tasks-section">Ближайшие задачи</div>
    <div class="timeline" aria-live="polite">
      <ul class="timeline__list" id="timeline"></ul>
    </div>
  </div>

  <div class="modal" id="login-modal" hidden>
    <div class="modal__dialog">
      <h3>Вход</h3>
      <p class="modal__note">Введите логин и пароль, если вы не авторизованы через Telegram.</p>
      <form id="login-form">
        <label class="modal__field">
          <span>Логин</span>
          <input type="text" id="login-username" name="username" autocomplete="username" required />
        </label>
        <label class="modal__field">
          <span>Пароль</span>
          <input type="password" id="login-password" name="password" autocomplete="current-password" required />
        </label>
        <div class="modal__actions">
          <button type="submit" class="button button--primary">Войти</button>
          <button type="button" class="button button--ghost" id="login-cancel">Отмена</button>
        </div>
        <div class="modal__error" id="login-error" hidden></div>
      </form>
    </div>
  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="constants.js"></script>
  <script src="app.js"></script>
</body>
</html>
