<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Карточка растения</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <header class="detail-header">
      <div class="detail-header__group">
        <button class="button button--ghost" id="back-btn" type="button">↩ Назад</button>
      </div>
      <div class="detail-header__group">
        <button class="button button--ghost" id="theme-toggle" type="button">Тема</button>
        <button class="button button--primary" id="edit-toggle" type="button">Редактировать</button>
      </div>
    </header>

    <section class="detail-hero" aria-live="polite">
      <div class="detail-hero__image" id="hero-image"></div>
      <div class="detail-hero__meta">
        <p class="eyebrow">Растение</p>
        <h1 id="plant-name">Загрузка...</h1>
        <div class="card__subtitle" id="plant-scientific"></div>
        <p class="lede" id="plant-description">Собираем сведения...</p>
        <div class="badges" id="plant-badges"></div>
      </div>
    </section>

    <section class="detail-grid" id="detail-grid"></section>

    <section class="edit-panel" id="edit-panel" hidden>
      <div class="edit-panel__header">
        <div>
          <p class="eyebrow">Редактирование</p>
          <h2 class="section-title">Данные растения</h2>
        </div>
        <div class="edit-status" id="edit-status" aria-live="polite"></div>
      </div>

      <form id="edit-form" class="edit-form" novalidate>
        <div class="form-grid">
          <article class="form-card form-card--primary">
            <div class="form-card__header">
              <div>
                <div class="eyebrow">Основное + изображение</div>
              </div>
            </div>

            <label class="form-field">
              <span class="form-label">Название</span>
              <input type="text" id="field-name" name="name" placeholder="Например, Фикус" />
            </label>

            <label class="form-field">
              <span class="form-label">Латинское название</span>
              <input type="text" id="field-scientific" name="scientific_name" placeholder="Ficus lyrata" />
            </label>

            <label class="form-field">
              <span class="form-label">Описание</span>
              <textarea id="field-description" name="description" rows="4" placeholder="Краткая памятка"></textarea>
            </label>

            <div class="form-subsection form-subsection--image">
              <div class="form-field">
                <span class="form-label">Файл изображения</span>
                <div class="upload-row">
                  <button class="button button--ghost" type="button" id="image-upload-btn">Выбрать файл</button>
                  <span class="upload-filename" id="image-filename">Файл не выбран</span>
                </div>
                <input type="file" id="image-input" accept="image/*" hidden />
              </div>

              <div class="image-preview-wrap" id="image-preview-wrap" hidden>
                <img class="image-preview" id="image-preview" alt="Предпросмотр изображения" />
              </div>
            </div>
          </article>

          <article class="form-card">
            <div class="form-card__header">
              <div>
                <div class="eyebrow">Тёплый период</div>
              </div>
            </div>

            <div class="form-row">
              <label class="form-field">
                <span class="form-label">Начало, дд.мм</span>
                <input type="text" inputmode="numeric" id="field-warm-start" placeholder="01.04" />
              </label>
              <label class="form-field">
                <span class="form-label">Конец, дд.мм</span>
                <input type="text" inputmode="numeric" id="field-warm-end" placeholder="01.10" />
              </label>
            </div>

            <label class="form-field">
              <span class="form-label">Тип расписания</span>
              <select id="field-warm-schedule-type">
                <option value="weekly">еженедельно</option>
                <option value="biweekly">раз в 2 недели</option>
                <option value="monthly">раз в месяц</option>
              </select>
            </label>

            <div class="form-field" id="warm-weekdays-group">
              <span class="form-label">Дни недели</span>
              <div class="weekday-grid">
                <label class="checkbox-field"><input type="checkbox" name="warm-weekday" value="0" />Пн</label>
                <label class="checkbox-field"><input type="checkbox" name="warm-weekday" value="1" />Вт</label>
                <label class="checkbox-field"><input type="checkbox" name="warm-weekday" value="2" />Ср</label>
                <label class="checkbox-field"><input type="checkbox" name="warm-weekday" value="3" />Чт</label>
                <label class="checkbox-field"><input type="checkbox" name="warm-weekday" value="4" />Пт</label>
                <label class="checkbox-field"><input type="checkbox" name="warm-weekday" value="5" />Сб</label>
                <label class="checkbox-field"><input type="checkbox" name="warm-weekday" value="6" />Вс</label>
              </div>
            </div>

            <label class="form-field" id="warm-monthday-group" hidden>
              <span class="form-label">Число месяца</span>
              <input type="number" min="1" max="31" step="1" id="field-warm-monthday" placeholder="15" />
            </label>

            <label class="form-field">
              <span class="form-label">Заметка периода</span>
              <textarea id="field-warm-note" rows="2" placeholder="Напоминания по поливу"></textarea>
            </label>
          </article>

          <article class="form-card">
            <div class="form-card__header">
              <div>
                <div class="eyebrow">Холодный период</div>
              </div>
            </div>

            <div class="form-row">
              <label class="form-field">
                <span class="form-label">Начало, дд.мм</span>
                <input type="text" inputmode="numeric" id="field-cold-start" placeholder="01.10" />
              </label>
              <label class="form-field">
                <span class="form-label">Конец, дд.мм</span>
                <input type="text" inputmode="numeric" id="field-cold-end" placeholder="01.04" />
              </label>
            </div>

            <label class="form-field">
              <span class="form-label">Тип расписания</span>
              <select id="field-cold-schedule-type">
                <option value="weekly">еженедельно</option>
                <option value="biweekly">раз в 2 недели</option>
                <option value="monthly">раз в месяц</option>
              </select>
            </label>

            <div class="form-field" id="cold-weekdays-group">
              <span class="form-label">Дни недели</span>
              <div class="weekday-grid">
                <label class="checkbox-field"><input type="checkbox" name="cold-weekday" value="0" />Пн</label>
                <label class="checkbox-field"><input type="checkbox" name="cold-weekday" value="1" />Вт</label>
                <label class="checkbox-field"><input type="checkbox" name="cold-weekday" value="2" />Ср</label>
                <label class="checkbox-field"><input type="checkbox" name="cold-weekday" value="3" />Чт</label>
                <label class="checkbox-field"><input type="checkbox" name="cold-weekday" value="4" />Пт</label>
                <label class="checkbox-field"><input type="checkbox" name="cold-weekday" value="5" />Сб</label>
                <label class="checkbox-field"><input type="checkbox" name="cold-weekday" value="6" />Вс</label>
              </div>
            </div>

            <label class="form-field" id="cold-monthday-group" hidden>
              <span class="form-label">Число месяца</span>
              <input type="number" min="1" max="31" step="1" id="field-cold-monthday" placeholder="15" />
            </label>

            <label class="form-field">
              <span class="form-label">Заметка периода</span>
              <textarea id="field-cold-note" rows="2" placeholder="Что учесть в холодное время"></textarea>
            </label>
          </article>

          <article class="form-card">
            <div class="form-card__header">
              <div>
                <div class="eyebrow">Даты + подкормки</div>
              </div>
            </div>

            <div class="form-subsection">
              <div class="form-row">
                <label class="form-field">
                  <span class="form-label">Последний полив</span>
                  <input type="date" id="field-last-watered-at" name="last_watered_at" />
                </label>
                <label class="form-field">
                  <span class="form-label">Следующий полив</span>
                  <input type="date" id="field-next-watering-at" name="next_watering_at" />
                </label>
              </div>
            </div>

            <div class="form-subsection">
              <div class="form-row">
                <label class="form-field">
                  <span class="form-label">Последняя подкормка</span>
                  <input type="date" id="field-last-fertilized-at" name="last_fertilized_at" />
                </label>
                <label class="form-field">
                  <span class="form-label">Следующая подкормка</span>
                  <input type="date" id="field-next-fertilizing-at" name="next_fertilizing_at" />
                </label>
              </div>
            </div>

            <div class="form-row">
              <label class="form-field">
                <span class="form-label">Начало, дд.мм</span>
                <input type="text" inputmode="numeric" id="field-fert-start" placeholder="01.03" />
              </label>
              <label class="form-field">
                <span class="form-label">Конец, дд.мм</span>
                <input type="text" inputmode="numeric" id="field-fert-end" placeholder="01.09" />
              </label>
            </div>

            <div class="form-row">
              <label class="form-field">
                <span class="form-label">Каждые</span>
                <input type="number" min="1" step="1" id="field-fert-frequency" placeholder="2" />
              </label>
              <label class="form-field">
                <span class="form-label">Единица</span>
                <select id="field-fert-type">
                  <option value="days">дней</option>
                  <option value="weeks">недель</option>
                  <option value="months">месяцев</option>
                </select>
              </label>
            </div>

            <label class="form-field">
              <span class="form-label">Заметка</span>
              <textarea id="field-fert-note" rows="2" placeholder="Особенности подкормки"></textarea>
            </label>
          </article>
        </div>

        <div class="form-actions">
          <button class="button button--primary" type="submit" id="save-plant">Сохранить</button>
          <button class="button button--ghost" type="button" id="hide-edit">Скрыть</button>
        </div>
      </form>

    </section>
  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="constants.js?v=2"></script>
  <script src="auth.js?v=2"></script>
  <script src="ui-utils.js?v=2"></script>
  <script src="plant.js?v=2"></script>
</body>
</html>
