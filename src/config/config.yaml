service:
  title: Plants bot info
  description: Show plants info
  host: "0.0.0.0"
  port: 8000
  timeout: 60
  workers: 4

  service_chat_id: 459335857

  debug: false
  access_token_ttl: 3600
  refresh_token_ttl: 14400
  max_sessions_per_user: 10

  init_data_max_age: 86400
  init_data_skew: 60
  bot_init_data_max_age: 300

  tag_metadata_auth_web:
    name: "Auth web"
    description: "Registration and authentication for web"
  tag_metadata_auth_telegram:
    name: "Auth telegram"
    description: "Registration and authentication for telegram"
  tag_metadata_auth_bot:
    name: "Auth bot"
    description: "Registration and authentication for bot"
  tag_metadata_plant:
    name: "Plant"
    description: "Plants info"
  tag_metadata_health:
    name: "Health"
    description: "Health endpoints. For services only!"

redis:
  host: localhost
  port: 6379
  db: 7
  decode_responses: true

mongodb:
  host: "127.0.0.1"
  port: 27017
  db: "plants_bot"
  max_retries: 3
  backoff_base: 0.05
  backoff_jitter: 0.05

cors:
  allow_origins:
    - "*"
  allow_credentials: true
  allow_methods:
    - "*"
  allow_headers:
    - "*"

logger:
  format: "[%(asctime)s.%(msecs)03d] PID:%(process)-5d %(funcName)-35s %(module)-12s:%(lineno)-4d %(levelname)-7s - %(message)s"
  exclude:
    - "/api/v1/healthz"
  date_format: "%Y-%m-%d %H:%M:%S"
  level: "INFO"

storage:
  bucket: plants
  endpoint_url: https://storage-wagonbid.ddns.net
