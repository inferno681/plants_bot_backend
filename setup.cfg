[flake8]
ignore = D100, DAR101, DAR201, DAR301, DAR401, WPS602

nested-classes-whitelist = Settings

format = wemake

max-imports = 17

max-methods = 10

max-module-members = 9

exclude =
  .git
  .venv
  .devcontainer
  __init__.py
  .vscode
  venv
  alembic
  db_loader.py
  data_processing.py
  code_parts.py
  get_all.py

max-try-body-length = 3
max-complexity = 6
max-line-length = 79

per-file-ignores =
  run_main.py: WPS231
  logger.py: WPS226, WPS204

  src/app/api/v1/plant.py: WPS217, WPS210

  src/app/services/auth.py: WPS226, WPS110, C901

  src/app/models/plant.py: WPS110, WPS210, WPS231
  src/app/models/mixin.py: WPS601

  src/app/schemes/pagination.py: WPS110

  src/app/utils/ordering.py: WPS110, C901, WPS232, WPS237, WPS210, WPS231


[isort]

line_length = 79
multi_line_output = 3
include_trailing_comma = true


[coverage:run]

concurrency =
  greenlet
  thread

[coverage:report]

exclude_lines =
    pragma: no cover
    if TYPE_CHECKING:

[tool:pytest]
testpaths = src/tests
