[flake8]
ignore = D100, DAR101, DAR201, DAR301, DAR401, WPS602

format = wemake

max-imports = 17

max-methods = 10

max-module-members = 9

exclude =
  .git
  .venv
  .devcontainer
  __init__.py
  .vscode
  venv
  alembic
  db_loader.py
  data_processing.py
  code_parts.py
  get_all.py

max-try-body-length = 3
max-complexity = 6
max-line-length = 79

per-file-ignores =
  main.py: WPS226, WPS237, WPS201, WPS213, WPS217
  run_main.py: WPS231


[isort]

line_length = 79
multi_line_output = 3
include_trailing_comma = true


[coverage:run]

concurrency =
  greenlet
  thread

[coverage:report]

exclude_lines =
    pragma: no cover
    if TYPE_CHECKING:

[tool:pytest]
testpaths = src/tests
